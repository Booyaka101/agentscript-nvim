name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per branch. A second push supersedes the first instead of queueing
# behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22 # tests/fake_npm.js and the stub servers run under it
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      # test_treesitter fetches the published grammar sources with npm pack
      # and builds them with the runner's gcc. test_lsp installs the real
      # server into scratch/ and runs test_treesitter again inside the same
      # session. test_upstream_config needs an nvim-lspconfig clone. test_sf
      # runs sf.lua against tests/fake_sf.js, which replays real org output.
      - run: nvim -l tests/test_install.lua
      - run: nvim -l tests/test_treesitter.lua
      - run: nvim -l tests/test_lsp.lua
      - run: nvim -l tests/test_sf.lua
